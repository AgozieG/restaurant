<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Daisy Life</title>
  <meta name="description"
    content="Log in to your Daisy Life account to order grills, BBQ, pasta and rice for pickup or delivery in Enugu." />
  <meta property="og:title" content="Log in — Daisy Life" />
  <meta property="og:description" content="Access your Daisy Life account and continue your order." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body data-page="login">
  <main class="wrap auth-wrap">
    <div class="reveal">
      <span class="eyebrow">Welcome back</span>
      <h1 style="font-size:clamp(30px,5vw,46px);margin:14px 0 10px">Log in to Daisy Life</h1>
      <p class="lead" style="margin-bottom:22px">Your cart, saved details and order history live here.</p>
      <form class="card" id="form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" type="email"
            placeholder="you@example.com" /></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password"
            placeholder="••••••••" /></div>
        <p class="err" id="err"></p>
        <button class="btn" style="width:100%">Log in →</button>
        <p class="lead" style="font-size:14px;margin-top:14px">New here? <a href="./signup.html"
            style="color:var(--red-deep);font-weight:700">Create an account</a></p>
      </form>
    </div>
    <div class="auth-art hero-art reveal"><img src="./img/grill.jpg" alt="Grilled catfish with pepper sauce"
        loading="lazy" />
      <div class="tag">🐟 Grilled fresh, every day</div>
    </div>
  </main>
  <script src="./js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "/site/menu.html";
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      try {
        Auth.login(document.getElementById("email").value.trim(), document.getElementById("password").value);
        toast("Welcome back!");
        setTimeout(() => (location.href = next), 500);
      } catch (ex) { err.textContent = ex.message; }
    });
  </script>
</body>

</html>
